name: Merge AdGuard Home Rules

# 仅定时触发 + 手动触发；无任何 push 触发器，
# 因此修改 sources.txt / merge.py 等文件提交后不会自动启动更新。
on:
  schedule:
    - cron: "0 20 * * *"   # 每天 UTC 20:00 = 北京时间凌晨 04:00
  workflow_dispatch:        # 仅当在 Actions 页面手动点击 Run workflow 时才运行

permissions:
  contents: write

concurrency:
  group: merge-rules
  cancel-in-progress: false   # 同一时间只允许一个实例，避免并发写冲突

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 合并规则
        run: python merge.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adguard-filter.txt
          if git diff --cached --quiet; then
            echo "规则无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: update merged filter [skip ci]"
          # 冲突处理：推送前先 rebase 远端，失败自动重试 3 次
          for i in 1 2 3; do
            git pull --rebase origin HEAD && git push && exit 0
            echo "推送失败，5 秒后重试（第 $i 次）"
            sleep 5
          done
          echo "重试 3 次仍失败" && exit 1
