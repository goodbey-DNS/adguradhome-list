name: Update AdGuard Filter

# 仅定时 + 手动触发；无任何 push 触发器，
# 因此修改 sources.txt / merge.py 等文件提交后不会自动启动更新。
on:
  schedule:
    # 一天三个时段互为备份：任一成功即完成当日更新。
    # 工作流是幂等的（孤儿分支强推覆盖），重复运行完全无害。
    # 分钟数刻意避开整点，降低被 GitHub 延迟/跳过的概率。
    - cron: "23 20 * * *"   # 北京时间 04:23
    - cron: "23 22 * * *"   # 北京时间 06:23
    - cron: "23 0 * * *"    # 北京时间 08:23
  workflow_dispatch:        # 仅当在 Actions 页面手动点击 Run workflow 时才运行

permissions:
  contents: write

# 关于 60 天机制：GitHub 对长期无活动的仓库会暂停定时任务并邮件提醒。
# 本工作流每天向 filter 分支推送新提交，仓库始终保持活跃，天然规避；
# 即使万一被暂停，按邮件提示到 Actions 页面点 Enable 即可恢复。

concurrency:
  group: update-filter
  cancel-in-progress: false   # 同一时间只允许一个实例，避免并发写冲突

jobs:
  merge:
    runs-on: ubuntu-24.04     # 固定镜像版本，不随 ubuntu-latest 漂移，长期稳定
    timeout-minutes: 90       # 兜底：任务异常挂起时自动终止
    steps:
      - name: 前置检查（默认分支不能是 filter）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 此步骤在 checkout 之前运行，工作区没有 .git，
          # 必须显式传仓库名（Actions 内置变量），不能依赖当前目录解析
          default_branch=$(gh api "repos/${{ github.repository }}" -q .default_branch)
          echo "当前默认分支: $default_branch"
          if [ "$default_branch" = "filter" ]; then
            echo "::error::仓库默认分支不能设为 filter：定时任务要求 workflow 文件在默认分支上，且 filter 分支每次运行都会被强推覆盖。请把默认分支改回 main。"
            exit 1
          fi

      - name: 检出仓库
        uses: actions/checkout@v7   # Node 24 运行时，无弃用警告
        with:
          fetch-depth: 1            # 只取最新提交：orphan 强推无需历史（本为默认值，显式声明）

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # 固定版本，长期稳定

      - name: 合并规则（多源并发拉取）
        run: python merge.py

      - name: 推送结果到 filter 分支（单提交强推，仓库体积不膨胀）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 文件头每次写入新 UTC 时间戳，内容必然变化，故不设"无变化跳过"判断。
          # 输出到独立 filter 分支：每天 50M+ 文本若累积在主分支历史中，
          # 仓库会无限膨胀直至超限。孤立分支 + 强推保证历史始终只有 1 个提交。
          git checkout --orphan filter_new
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add adguard-filter*.txt
          git commit -m "chore: update merged filter $(date -u +%Y-%m-%d)"
          # 冲突处理：强推无需 rebase，失败自动重试 3 次
          for i in 1 2 3; do
            git push -f origin filter_new:filter && exit 0
            echo "推送失败，5 秒后重试（第 $i 次）"
            sleep 5
          done
          echo "重试 3 次仍失败" && exit 1
