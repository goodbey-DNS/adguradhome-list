# ============================================================================
# AdGuard 规则合并去重（GitHub Actions 最终合体版）
# ============================================================================
# 作用：每日北京 03:00 自动拉取 sources.txt 列出的源规则，
#       跑 scripts/merge.py 去重合并，结果用 orphan + force push 提交回 main。
#       改 sources.txt / merge.py / 本文件 后 push 也会自动触发。
#       orphan + force push：每次提交都是孤立快照，不累积 git 历史，防仓库膨胀。
#
# 合体增强（借鉴 update.yml）：
#   - timeout-minutes: 30    防单次运行卡死
#   - concurrency           防并发重复跑（定时与手动撞车时排队，不互相取消）
#   - upload-artifact       失败时保留 merge.log + stats.json 便于排查
# ============================================================================

name: AdGuard规则合并去重

on:
  schedule:
    - cron: '0 19 * * *'  # UTC 19:00 = 北京 03:00
  workflow_dispatch:  # 仅手动触发 + 每日定时，改文件不自动跑

# 并发控制：同一时间只允许一个实例运行，新的等待旧的完成（不取消进行中，避免丢数据）
concurrency:
  group: adguard-merge
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 防单次运行卡死
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 合并去重
        run: python3 scripts/merge.py 2>&1 | tee merge.log

      - name: 校验产出
        run: |
          if [ ! -s adguard-merged.txt ]; then
            echo "错误：adguard-merged.txt 不存在或为空"
            exit 1
          fi
          echo "产出规则数：$(grep -c '^||' adguard-merged.txt)"

      - name: 上传日志与统计（便于排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-log
          path: |
            merge.log
            stats.json
          retention-days: 7
          if-no-files-found: warn

      - name: 提交推送（orphan + force push 防膨胀）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f merge.log  # 日志不入库，仅保留在 artifact
          git checkout --orphan tmp_orphan
          git add -A
          git commit -m "chore: auto update merged rules [skip ci]"
          git push --force origin tmp_orphan:main
